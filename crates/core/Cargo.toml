[package]
name = "naurix-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
portable-pty = "0.9"
thiserror = "2"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

# Linux: Secret Service over D-Bus (GNOME Keyring, KWallet). Windows: Credential Manager. ADR 0021.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
